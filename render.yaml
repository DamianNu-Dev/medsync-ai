services:
  - type: web
    name: medsync-ai-backend
    env: node
    rootDir: server
    buildCommand: "cd /opt/render/project/src && pnpm install --frozen-lockfile"
    startCommand: "cd /opt/render/project/src/server && node index.mjs"
    envVars:
      - key: SUPABASE_URL
        value: https://uctflkfdgifxcxdrooxf.supabase.co
      - key: SUPABASE_ANON_KEY
        value: TU_SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: TU_SUPABASE_SERVICE_ROLE_KEY
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
