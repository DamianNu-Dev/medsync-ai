name: Estado de la IA (Groq)

# Comprueba diariamente (y bajo demanda) la clave principal y la de respaldo,
# el modelo configurado y la cuota restante. Las claves viven en Secrets.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar claves y cuota
        env:
          GROQ_PRIMARY_KEY: ${{ secrets.GROQ_PRIMARY_KEY }}
          GROQ_FALLBACK_KEY: ${{ secrets.GROQ_FALLBACK_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
        run: python3 scripts/check_groq.py
